<!DOCTYPE html>
<html>
	<head>
		<title>A Very Simple Battleship Game</title>
		<link rel="stylesheet" type="text/css" href="style.css">
	</head>
	<body>
	<h1>Battleship</h1>	
<!-- maybe have a new game button that starts the game? -->
	<div id="infoContainer">
		<div id="guessCount"></div>
		<div id="gameInfo"></div>
	</div>
	<div class="mode-select-container">
		<button id="singleMode" title="Try to sink all battleships randomly placed on a board in as few moves as possible">Single Mode</button>
		<button id="vsCpu" title="Set up your board, play against a CPU">Versus CPU</button>
	</div>
	<div id="nav">
		<button id="backBtn" class="hide">Back</button>
	</div>
	<form id="singleModeForm" class="single-mode-container hide">
		<select name="difficulty" id="difficulty" class="difficulty">
			<option value="easy">Easy</option>
			<option value="normal" selected>Normal</option>
			<option value="hard">Hard</option>
		</select>
		<button class="single-mode-btn" type="submit">Start</button>
	</form>
	<form id="vsCpuModeForm" class="single-mode-container hide">
		<select name="difficulty" id="difficulty" class="difficulty">
			<option value="easy">Easy</option>
			<option value="normal" selected>Normal</option>
			<option value="hard">Hard</option>
		</select>
		<button class="single-mode-btn" type="submit">Start</button>
	</form>
	<div id="gameboard" class="game-board">
	</div>
	<!-- <div><span id="turn"></span><span>Turn</span></div> -->
	<script type="text/javascript" src="battleship.js"></script>
	</body>
</html>
