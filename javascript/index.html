<!DOCTYPE html>
<html>
	<head>
		<title>A Very Simple Battleship Game</title>
		<link rel="stylesheet" type="text/css" href="style.css">
	</head>
	<body>
	<h1>Battleship</h1>	
<!-- maybe have a new game button that starts the game? -->
	<div id="infoContainer">
	</div>
	<form id="startForm" class="start-container">
	<p>Click start to begin</p>
		<select name="difficulty" id="difficulty" class="difficulty">
			<option value="easy">Easy</option>
			<option value="normal" selected>Normal</option>
			<option value="hard">Hard</option>
</select>
		<button class="start-btn" type="submit">Start</button>
	</form>
	<div id="gameboard" class="game-board">
	</div>
	<!-- <div><span id="turn"></span><span>Turn</span></div> -->
	<script type="text/javascript" src="battleship.js"></script>
	</body>
</html>
